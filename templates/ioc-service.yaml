apiVersion: v1
kind: Service
metadata:
  name: {{ include "ioc-chart.release" . }}
  {{- if not .Values.staticIP }}
  annotations:
    # No static IP configured for this beamline (baseIp/startIp unset), so this Service
    # relies on a dynamically-assigned ClusterIP. Keep it alive across an ArgoCD app
    # delete/recreate cycle (not just pod restarts), otherwise clients caching its
    # address (e.g. a PVA gateway's nameserver config) break on every IOC redeploy.
    argocd.argoproj.io/sync-options: Delete=false
  {{- end }}
spec:
  selector:
    {{- include "ioc-chart.selectorLabels" . | nindent 4 }}
  {{- if .Values.staticIP }}
  clusterIP: {{.Values.staticIP}}
  {{- end }}
{{- if and (hasKey .Values "devtype") (eq .Values.devtype "development") }}
  type: NodePort
{{- else }}
  type: ClusterIP
{{- end }}
  ports:
{{- if and (hasKey .Values "devtype") (eq .Values.devtype "development") }}
  - name: ssh
    port: 22
    targetPort: 22
    protocol: TCP
    nodePort: {{ .Values.ssh_nodeport }}
{{- end }}
  - name: ca-server-tcp
    port: {{ .Values.ca_server_port | default 5064 }}
    targetPort: {{ .Values.ca_server_port | default 5064 }}
    protocol: TCP
  - name: ca-server-udp
    port: {{ .Values.ca_server_port | default 5064 }}
    targetPort: {{ .Values.ca_server_port | default 5064 }}
    protocol: UDP
  - name: ca-repeater-tcp
    port: {{ add1 (.Values.ca_server_port | default 5064) }}
    targetPort: {{ add1 (.Values.ca_server_port | default 5064) }}
    protocol: TCP
  - name: ca-repeater-udp
    port: {{ add1 (.Values.ca_server_port | default 5064) }}
    targetPort: {{ add1 (.Values.ca_server_port | default 5064) }}
    protocol: UDP
  - name: pva-server-tcp
    port: {{ .Values.pva_server_port | default 5075 }}
    targetPort: {{ .Values.pva_server_port | default 5075 }}
    protocol: TCP
  - name: pva-server-udp
    port: {{ .Values.pva_server_port | default 5075 }}
    targetPort: {{ .Values.pva_server_port | default 5075 }}
    protocol: UDP
  - name: pva-broadcast-tcp
    port: {{ add1 (.Values.pva_server_port | default 5075) }}
    targetPort: {{ add1 (.Values.pva_server_port | default 5075) }}
    protocol: TCP
  - name: pva-broadcast-udp
    port: {{ add1 (.Values.pva_server_port | default 5075) }}
    targetPort: {{ add1 (.Values.pva_server_port | default 5075) }}
    protocol: UDP

  {{- if hasKey .Values.service "port" }}
  - port: {{ .Values.service.port }}
    targetPort: {{.Values.service.port}}
    protocol: TCP
    name: rest
  {{- end }}
  {{- if .Values.service.http.enable }}
  - port: 80
    targetPort: {{.Values.service.http.port}}
    protocol: TCP
    name: http
  {{- end }}

